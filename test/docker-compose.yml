services:
  odp-db:
    container_name: TEST-odp-db
    image: postgres:14
    ports:
      - "7357:5432"
    environment:
      - POSTGRES_USER=${ODP_DB_USER}
      - POSTGRES_PASSWORD=${ODP_DB_PASS}
    restart: always

  redis:
    container_name: TEST-redis
    image: redis:6
    ports:
      - "7379:6379"
    restart: always
